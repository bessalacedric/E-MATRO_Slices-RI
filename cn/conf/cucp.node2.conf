########################################
# CU-CP Node 2 — vm-server-3 (10.10.211.225)
# Serves DU node0 (vm-server-1)
# N2 → AMF on vm-controller (10.10.212.98:38412)
# E1 → CU-UP on same host (127.0.0.1)
########################################

Active_gNBs = ( "cu-cp-node2" );
Asn1_verbosity = "none";

gNBs = (
{
    ////////// Identification
    gNB_ID    = 0xe00;
    gNB_name  = "cu-cp-node2";
    tracking_area_code  = 1;
    plmn_list = ({
        mcc = 001; mnc = 01; mnc_length = 2;
        snssaiList = (
            { sst = 1; sd = 0xffffff },
            { sst = 1; sd = 0x1      }
        );
    });
    nr_cellid = 12345678L;

    ////////// F1 — CU-CP side (accepts from DU)
    tr_s_preference  = "f1";
    local_s_address  = "10.10.211.225";    # this CU-CP IP
    local_s_portc    = 500;               # F1-C (CU-CP listens)
    local_s_portd    = 2153;              # F1-U (GTP-U CU-UP side)

    ////////// N2 — connect to AMF
    # AMF is on vm-controller Docker network, exposed via host port
    amf_ip_address = ({
        ipv4       = "10.10.208.188";      # vm-controller host IP
        ipv6       = "::1";
        active     = "yes";
        preference = "ipv4";
    });

    NETWORK_INTERFACES: {
        GNB_INTERFACE_NAME_FOR_NG_AMF = "eth0";
        GNB_IPV4_ADDRESS_FOR_NG_AMF   = "10.10.211.225";
        GNB_INTERFACE_NAME_FOR_NGU    = "eth0";
        GNB_IPV4_ADDRESS_FOR_NGU      = "10.10.211.225";
        GNB_PORT_FOR_S1U              = 2153;
    };

    ////////// E1 — connect to CU-UP on same host
    e1_ipaddress = "127.0.0.1";
    e1_portc     = 38462;
}
);

log_config: {
    global_log_level   = "info";
    global_log_options = "level,nocolor,time";
};
