services:

  oai-nr-ue:
    image: oaisoftwarealliance/oai-nr-ue:2024.w26
    privileged: true
    container_name: oai-nr-ue
    cap_add:
      - NET_ADMIN
    environment:
      USE_ADDITIONAL_OPTIONS: "-E --sa --rfsim -r 106 --numerology 1 --uicc0.imsi 001010000000101 -C 3319680000 --rfsimulator.serveraddr 10.10.212.103 --rfsimulator.serverport 4043 --log_config.global_log_options level,nocolor,time"
    volumes:
      - ./conf/ue1.conf:/opt/oai-nr-ue/etc/nr-ue.conf
    networks:
      public_net:
        ipv4_address: 192.168.70.150
    healthcheck:
      test: /bin/bash -c "pgrep nr-uesoftmodem"
      interval: 10s
      timeout: 5s
      retries: 5

