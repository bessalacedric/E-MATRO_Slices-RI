services:
  oai-du-node0:
    image: oaisoftwarealliance/oai-gnb:2024.w26
    privileged: true
    container_name: oai-du-node0
    network_mode: host
    environment:
      USE_ADDITIONAL_OPTIONS: -E --sa --rfsim --log_config.global_log_options level,nocolor,time
    volumes:
      - ./conf/du.node0.conf:/opt/oai-gnb/etc/gnb.conf
    healthcheck:
      test: /bin/bash -c "pgrep nr-softmodem"
      interval: 10s
      timeout: 5s
      retries: 10

  oai-du-node1:
    image: oaisoftwarealliance/oai-gnb:2024.w26
    privileged: true
    container_name: oai-du-node1
    network_mode: host
    environment:
      USE_ADDITIONAL_OPTIONS: -E --sa --rfsim --log_config.global_log_options level,nocolor,time
    volumes:
      - ./conf/du.node1.conf:/opt/oai-gnb/etc/gnb.conf
    healthcheck:
      test: /bin/bash -c "pgrep nr-softmodem"
      interval: 10s
      timeout: 5s
      retries: 10
