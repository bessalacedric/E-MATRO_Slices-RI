########################################
# CU-UP Node 2 — vm-server-3 (10.10.210.51)
# N3 → UPF on vm-controller (10.10.212.98:2152)
# E1 → CU-CP on same host (127.0.0.1)
########################################

Active_gNBs = ( "cu-up-node2" );
Asn1_verbosity = "none";

gNBs = (
{
    gNB_ID   = 0xe00;
    gNB_name = "cu-up-node2";
    plmn_list = ({
        mcc = 001; mnc = 01; mnc_length = 2;
        snssaiList = (
            { sst = 1; sd = 0xffffff },
            { sst = 1; sd = 0x1      }
        );
    });

    ////////// N3 — GTP-U toward UPF
    # UPF is at 192.168.70.134 on Docker net, exposed on vm-controller host
    NETWORK_INTERFACES: {
        GNB_INTERFACE_NAME_FOR_NGU = "eth0";
        GNB_IPV4_ADDRESS_FOR_NGU   = "10.10.210.51";
        GNB_PORT_FOR_S1U           = 2153;
        # UPF endpoint (vm-controller host-forwarded)
        GNB_IPV4_ADDRESS_FOR_NGU_UPF = "10.10.212.98";
        GNB_PORT_FOR_NGU_UPF         = 2152;
    };

    ////////// E1 — connect to CU-CP on same host
    e1_ipaddress = "127.0.0.1";
    e1_portc     = 38462;
}
);

log_config: {
    global_log_level   = "info";
    global_log_options = "level,nocolor,time";
};
